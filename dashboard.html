<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Audit Shelf — React Dashboard</title>
  
  <!-- React 18, ReactDOM 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            surface: {
              DEFAULT: '#0f172a',
              card: '#1e293b',
              cardHover: '#283548',
              border: '#334155',
              borderLight: '#475569'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Menlo', 'Monaco', 'Courier New', 'monospace'],
          }
        }
      }
    };
  </script>
  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen overflow-hidden selection:bg-indigo-600 selection:text-white">
  <div id="root"></div>

  <!-- React.js Application Code -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // --- Modern SVG Icons ---
    const IconShelf = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
      </svg>
    );

    const IconBook = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
      </svg>
    );

    const IconChapter = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
    );

    const IconSearch = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    );

    const IconDiff = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
      </svg>
    );

    const IconTelemetry = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
    );

    const IconSettings = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    );

    const IconRefresh = () => (
      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    );

    // --- Main React App Component ---
    function App() {
      const [activeTab, setActiveTab] = useState('shelf');
      const [books, setBooks] = useState([]);
      const [chapters, setChapters] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [selectedBook, setSelectedBook] = useState(null);
      const [selectedChapter, setSelectedChapter] = useState(null);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      
      const defaultUrl = window.location.origin === "null" || !window.location.origin.startsWith("http") 
        ? "http://127.0.0.1:8000" 
        : window.location.origin;
      const [apiUrl, setApiUrl] = useState(() => localStorage.getItem('audit_api_url') || defaultUrl);
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('audit_api_key') || '');
      const [serverHealthy, setServerHealthy] = useState(true);

      const fetchData = useCallback(async () => {
        setLoading(true);
        setError(null);
        try {
          const headers = {};
          if (apiKey) headers['X-API-Key'] = apiKey;

          const [booksRes, chaptersRes, healthRes] = await Promise.all([
            fetch(`${apiUrl}/books`, { headers }),
            fetch(`${apiUrl}/chapters?limit=200`, { headers }),
            fetch(`${apiUrl}/health`, { headers }).catch(() => ({ ok: false }))
          ]);

          if (!booksRes.ok || !chaptersRes.ok) {
            throw new Error(`API responded with error (status: ${booksRes.status || chaptersRes.status})`);
          }

          const booksData = await booksRes.json();
          const chaptersData = await chaptersRes.json();

          setBooks(booksData);
          setChapters(chaptersData);
          setServerHealthy(healthRes.ok);
        } catch (err) {
          setError(err.message || 'Failed to reach Audit Shelf API');
          setServerHealthy(false);
        } finally {
          setLoading(false);
        }
      }, [apiUrl, apiKey]);

      useEffect(() => {
        fetchData();
      }, [fetchData]);

      // Telemetry metrics calculation (Live Validation Gate Pass Rate)
      const telemetry = useMemo(() => {
        const validatedChapters = chapters.filter(c => c.validation_status);
        const passedChapters = validatedChapters.filter(c => c.validation_status === 'passed');
        const passRate = validatedChapters.length > 0 
          ? Math.round((passedChapters.length / validatedChapters.length) * 100) 
          : 100;
        
        const features = new Set(books.map(b => b.feature));

        return {
          totalBooks: books.length,
          totalChapters: chapters.length,
          totalFeatures: features.size,
          validatedCount: validatedChapters.length,
          passedCount: passedChapters.length,
          failedCount: validatedChapters.length - passedChapters.length,
          passRate
        };
      }, [books, chapters]);

      return (
        <div className="flex h-screen bg-slate-950 text-slate-100 overflow-hidden">
          {/* Sidebar */}
          <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between flex-shrink-0">
            <div>
              <div className="p-5 border-b border-slate-800">
                <div className="flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-md shadow-indigo-600/30">
                    AI
                  </div>
                  <div>
                    <h1 className="font-bold text-base leading-tight tracking-tight text-white flex items-center gap-1.5">
                      Audit Shelf
                      <span className="text-[10px] bg-indigo-500/20 text-indigo-400 font-mono px-1.5 py-0.5 rounded border border-indigo-500/30">
                        React
                      </span>
                    </h1>
                    <p className="text-xs text-slate-400 font-medium">Git-like AI Versioning</p>
                  </div>
                </div>
              </div>

              {/* Navigation Items */}
              <nav className="p-3 space-y-1">
                {[
                  { id: 'shelf', label: 'Library Shelf', icon: <IconShelf /> },
                  { id: 'books', label: 'Books (Features)', icon: <IconBook /> },
                  { id: 'chapters', label: 'Chapters (Audit Log)', icon: <IconChapter /> },
                  { id: 'search', label: 'Search & Filters', icon: <IconSearch /> },
                  { id: 'diff', label: 'Semantic Diff', icon: <IconDiff /> },
                  { id: 'telemetry', label: 'Gate Telemetry', icon: <IconTelemetry /> },
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all ${
                      activeTab === tab.id
                        ? 'bg-indigo-600 text-white shadow-sm shadow-indigo-600/40 font-semibold'
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'
                    }`}
                  >
                    <span className={activeTab === tab.id ? 'text-white' : 'text-slate-400'}>{tab.icon}</span>
                    <span>{tab.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            {/* Bottom System Status */}
            <div className="p-4 border-t border-slate-800 bg-slate-900/60">
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-2">
                  <span className={`w-2.5 h-2.5 rounded-full ${serverHealthy ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'}`}></span>
                  <span className="text-xs font-medium text-slate-300">
                    {serverHealthy ? 'API Connected' : 'API Offline'}
                  </span>
                </div>
                <button
                  onClick={() => setIsSettingsOpen(true)}
                  className="p-1.5 text-slate-400 hover:text-white hover:bg-slate-800 rounded-md transition-colors"
                  title="Configure API Connection"
                >
                  <IconSettings />
                </button>
              </div>
              <div className="text-[11px] font-mono text-slate-500 truncate" title={apiUrl}>
                {apiUrl}
              </div>
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 flex flex-col overflow-hidden">
            {/* Top Bar */}
            <header className="h-16 border-b border-slate-800 bg-slate-900/40 backdrop-blur px-8 flex items-center justify-between flex-shrink-0">
              <div className="flex items-center gap-4">
                <h2 className="text-lg font-semibold capitalize text-white">
                  {activeTab === 'shelf' && 'Bookshelf & Features'}
                  {activeTab === 'books' && 'Versioned Books'}
                  {activeTab === 'chapters' && 'Atomic Chapters Log'}
                  {activeTab === 'search' && 'Search & Audit History'}
                  {activeTab === 'diff' && 'Semantic Edition Diff'}
                  {activeTab === 'telemetry' && 'Validation Gate Telemetry'}
                </h2>
              </div>
              <div className="flex items-center gap-3">
                <a
                  href={`${apiUrl}/docs`}
                  target="_blank"
                  rel="noreferrer"
                  className="px-3 py-1.5 text-xs font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 rounded-md border border-slate-700 transition-colors"
                >
                  Interactive Docs
                </a>
                <button
                  onClick={fetchData}
                  disabled={loading}
                  className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-md transition-all shadow-sm disabled:opacity-50"
                >
                  <IconRefresh />
                  <span>Refresh</span>
                </button>
              </div>
            </header>

            {/* Content Body */}
            <div className="flex-1 overflow-y-auto p-8">
              {/* Telemetry KPI Cards Bar */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm">
                  <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Features</div>
                  <div className="text-2xl font-bold text-white mt-1">{telemetry.totalFeatures}</div>
                </div>
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm">
                  <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Books (Bundles)</div>
                  <div className="text-2xl font-bold text-white mt-1">{telemetry.totalBooks}</div>
                </div>
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm">
                  <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Logged Chapters</div>
                  <div className="text-2xl font-bold text-white mt-1">{telemetry.totalChapters}</div>
                </div>
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm">
                  <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center justify-between">
                    <span>Gate Pass Rate</span>
                    <span className="text-[10px] text-slate-400 font-mono">{telemetry.passedCount}/{telemetry.validatedCount}</span>
                  </div>
                  <div className={`text-2xl font-bold mt-1 ${telemetry.passRate >= 80 ? 'text-emerald-400' : 'text-amber-400'}`}>
                    {telemetry.passRate}%
                  </div>
                </div>
              </div>

              {/* Error Banner */}
              {error && (
                <div className="mb-6 p-4 rounded-xl bg-red-950/60 border border-red-800 text-red-200 flex items-start justify-between gap-4">
                  <div>
                    <h4 className="font-semibold text-sm">Connection Warning</h4>
                    <p className="text-xs text-red-300 mt-1">{error}</p>
                  </div>
                  <button
                    onClick={fetchData}
                    className="px-3 py-1 bg-red-800 hover:bg-red-700 text-white text-xs font-semibold rounded-md transition-colors"
                  >
                    Retry
                  </button>
                </div>
              )}

              {/* View Router */}
              {loading && books.length === 0 ? (
                <div className="flex flex-col items-center justify-center h-64 text-slate-400">
                  <div className="w-8 h-8 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                  <p className="text-sm">Loading audit library...</p>
                </div>
              ) : (
                <>
                  {activeTab === 'shelf' && (
                    <ShelfView books={books} onSelectBook={setSelectedBook} />
                  )}
                  {activeTab === 'books' && (
                    <BooksView books={books} apiUrl={apiUrl} onSelectBook={setSelectedBook} />
                  )}
                  {activeTab === 'chapters' && (
                    <ChaptersView chapters={chapters} onSelectChapter={setSelectedChapter} />
                  )}
                  {activeTab === 'search' && (
                    <SearchView apiUrl={apiUrl} apiKey={apiKey} onSelectChapter={setSelectedChapter} />
                  )}
                  {activeTab === 'diff' && (
                    <DiffView books={books} apiUrl={apiUrl} apiKey={apiKey} />
                  )}
                  {activeTab === 'telemetry' && (
                    <TelemetryView telemetry={telemetry} chapters={chapters} onSelectChapter={setSelectedChapter} />
                  )}
                </>
              )}
            </div>
          </main>

          {/* Book Detail Drawer */}
          {selectedBook && (
            <BookDetailDrawer
              book={selectedBook}
              allChapters={chapters}
              apiUrl={apiUrl}
              onClose={() => setSelectedBook(null)}
              onSelectChapter={setSelectedChapter}
            />
          )}

          {/* Chapter Detail Drawer */}
          {selectedChapter && (
            <ChapterDetailDrawer
              chapter={selectedChapter}
              onClose={() => setSelectedChapter(null)}
            />
          )}

          {/* Settings Modal */}
          {isSettingsOpen && (
            <SettingsModal
              currentUrl={apiUrl}
              currentKey={apiKey}
              onSave={(url, key) => {
                setApiUrl(url);
                setApiKey(key);
                localStorage.setItem('audit_api_url', url);
                localStorage.setItem('audit_api_key', key);
                setIsSettingsOpen(false);
              }}
              onClose={() => setIsSettingsOpen(false)}
            />
          )}
        </div>
      );
    }

    // --- View 1: Library Shelf ---
    function ShelfView({ books, onSelectBook }) {
      const grouped = useMemo(() => {
        const map = {};
        books.forEach(b => {
          if (!map[b.feature]) map[b.feature] = [];
          map[b.feature].push(b);
        });
        return map;
      }, [books]);

      if (books.length === 0) {
        return (
          <div className="text-center py-16 bg-slate-900 border border-slate-800 rounded-2xl">
            <h3 className="text-base font-semibold text-slate-300">The library shelf is empty</h3>
            <p className="text-xs text-slate-400 mt-1 max-w-sm mx-auto">
              Log your first chapter using the CLI or REST API to bundle features into books.
            </p>
          </div>
        );
      }

      return (
        <div className="space-y-8">
          {Object.entries(grouped).map(([feature, featureBooks]) => (
            <div key={feature} className="space-y-3">
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-indigo-500"></span>
                <h3 className="text-sm font-semibold tracking-wide uppercase text-slate-300">{feature}</h3>
                <span className="text-xs text-slate-400 font-mono">({featureBooks.length} editions)</span>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {featureBooks.map(book => (
                  <div
                    key={book.id}
                    onClick={() => onSelectBook(book)}
                    className="p-5 bg-slate-900 hover:bg-slate-850 border border-slate-800 hover:border-indigo-500/50 rounded-xl cursor-pointer transition-all hover:-translate-y-0.5 shadow-sm group"
                  >
                    <div className="flex items-start justify-between gap-3 mb-3">
                      <h4 className="font-semibold text-white group-hover:text-indigo-400 transition-colors line-clamp-1">
                        {book.title}
                      </h4>
                      <span className="px-2 py-0.5 text-xs font-bold rounded-md bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                        v{book.version}
                      </span>
                    </div>
                    <div className="flex flex-wrap items-center gap-3 text-xs text-slate-400 font-mono">
                      <span>{book.id}</span>
                      <span>•</span>
                      <span>{book.chapter_ids.length} chapters</span>
                      {book.parent_book_id && (
                        <>
                          <span>•</span>
                          <span className="text-slate-400">edits {book.parent_book_id}</span>
                        </>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }

    // --- View 2: Books Table ---
    function BooksView({ books, apiUrl, onSelectBook }) {
      const [filter, setFilter] = useState('');

      const filtered = books.filter(b =>
        b.title.toLowerCase().includes(filter.toLowerCase()) ||
        b.feature.toLowerCase().includes(filter.toLowerCase()) ||
        b.id.toLowerCase().includes(filter.toLowerCase())
      );

      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between gap-4">
            <input
              type="text"
              placeholder="Filter books by title, feature, or ID..."
              value={filter}
              onChange={e => setFilter(e.target.value)}
              className="w-80 px-3.5 py-2 text-xs bg-slate-900 border border-slate-800 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
            />
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
            <table className="w-full text-left text-xs">
              <thead className="bg-slate-850 text-slate-400 uppercase font-semibold border-b border-slate-800 tracking-wider">
                <tr>
                  <th className="py-3 px-4">ID</th>
                  <th className="py-3 px-4">Title</th>
                  <th className="py-3 px-4">Feature</th>
                  <th className="py-3 px-4">Version</th>
                  <th className="py-3 px-4">Chapters</th>
                  <th className="py-3 px-4">Created</th>
                  <th className="py-3 px-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800">
                {filtered.map(book => (
                  <tr
                    key={book.id}
                    onClick={() => onSelectBook(book)}
                    className="hover:bg-slate-800/40 cursor-pointer transition-colors"
                  >
                    <td className="py-3 px-4 font-mono font-medium text-indigo-400">{book.id}</td>
                    <td className="py-3 px-4 font-semibold text-white">{book.title}</td>
                    <td className="py-3 px-4 text-slate-300">{book.feature}</td>
                    <td className="py-3 px-4">
                      <span className="px-2 py-0.5 font-bold rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-mono">
                        v{book.version}
                      </span>
                    </td>
                    <td className="py-3 px-4 font-mono text-slate-300">{book.chapter_ids.length}</td>
                    <td className="py-3 px-4 text-slate-400 font-mono">
                      {new Date(book.created_at).toLocaleDateString()}
                    </td>
                    <td className="py-3 px-4 text-right space-x-2" onClick={e => e.stopPropagation()}>
                      <a
                        href={`${apiUrl}/export/book/${book.id}?format=markdown`}
                        target="_blank"
                        rel="noreferrer"
                        className="px-2.5 py-1 text-[11px] font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700 transition-colors"
                      >
                        MD
                      </a>
                      <a
                        href={`${apiUrl}/export/book/${book.id}?format=json`}
                        target="_blank"
                        rel="noreferrer"
                        className="px-2.5 py-1 text-[11px] font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700 transition-colors"
                      >
                        JSON
                      </a>
                    </td>
                  </tr>

    // --- View 5: Semantic Diff (GitHub-Style) ---

    function computeDiffData(diffLines) {
      if (!diffLines || diffLines.length === 0) {
        return { unified: [], split: [], additions: 0, deletions: 0 };
      }

      const unified = [];
      let oldLine = 1;
      let newLine = 1;
      let additions = 0;
      let deletions = 0;

      for (let i = 0; i < diffLines.length; i++) {
        const raw = diffLines[i];
        const prefix = raw.slice(0, 2);
        const text = raw.slice(2);

        if (prefix === '+ ') {
          additions++;
          unified.push({
            type: 'add',
            oldNum: null,
            newNum: newLine++,
            text: text
          });
        } else if (prefix === '- ') {
          deletions++;
          unified.push({
            type: 'del',
            oldNum: oldLine++,
            newNum: null,
            text: text
          });
        } else if (prefix === '  ') {
          unified.push({
            type: 'eq',
            oldNum: oldLine++,
            newNum: newLine++,
            text: text
          });
        }
      }

      // Build paired split rows
      const split = [];
      let i = 0;
      while (i < unified.length) {
        const item = unified[i];
        if (item.type === 'eq') {
          split.push({
            left: { num: item.oldNum, text: item.text, type: 'eq' },
            right: { num: item.newNum, text: item.text, type: 'eq' }
          });
          i++;
        } else if (item.type === 'del') {
          if (i + 1 < unified.length && unified[i + 1].type === 'add') {
            split.push({
              left: { num: item.oldNum, text: item.text, type: 'del' },
              right: { num: unified[i + 1].newNum, text: unified[i + 1].text, type: 'add' }
            });
            i += 2;
          } else {
            split.push({
              left: { num: item.oldNum, text: item.text, type: 'del' },
              right: null
            });
            i++;
          }
        } else if (item.type === 'add') {
          split.push({
            left: null,
            right: { num: item.newNum, text: item.text, type: 'add' }
          });
          i++;
        }
      }

      return { unified, split, additions, deletions };
    }

    // --- Main GitHub-Style DiffView Component ---
    function DiffView({ books, apiUrl, apiKey }) {
      const [idA, setIdA] = useState(books[0]?.id || '');
      const [idB, setIdB] = useState(books[1]?.id || books[0]?.id || '');
      const [diffData, setDiffData] = useState(null);
      const [comparing, setComparing] = useState(false);
      const [error, setError] = useState(null);
      const [viewMode, setViewMode] = useState('split'); // 'split' | 'unified'

      const runDiff = async () => {
        if (!idA || !idB) return;
        setComparing(true);
        setError(null);
        try {
          const headers = {};
          if (apiKey) headers['X-API-Key'] = apiKey;

          const res = await fetch(`${apiUrl}/diff/books?id_a=${idA}&id_b=${idB}`, { headers });
          if (!res.ok) throw new Error(`Diff failed with status: ${res.status}`);
          const data = await res.json();
          setDiffData(data);
        } catch (err) {
          setError(err.message || 'Diff calculation failed');
        } finally {
          setComparing(false);
        }
      };

      // Calculate total line adds and dels across all steps
      const totalStats = useMemo(() => {
        if (!diffData || !diffData.steps_comparison) return { adds: 0, dels: 0, stepsChanged: 0 };
        let adds = 0;
        let dels = 0;
        let changed = 0;

        diffData.steps_comparison.forEach(step => {
          if (!step.are_identical) changed++;
          const p = computeDiffData(step.prompt_diff);
          const r = computeDiffData(step.result_diff);
          adds += p.additions + r.additions;
          dels += p.deletions + r.deletions;
        });

        return { adds, dels, stepsChanged: changed };
      }, [diffData]);

      // GitHub 5-square diff progress bar
      const diffSquares = useMemo(() => {
        const total = totalStats.adds + totalStats.dels;
        if (total === 0) return [0, 0, 0, 0, 0];
        const greenCount = Math.min(5, Math.max(0, Math.round((totalStats.adds / total) * 5)));
        const redCount = 5 - greenCount;
        const res = [];
        for (let i = 0; i < greenCount; i++) res.push('green');
        for (let i = 0; i < redCount; i++) res.push('red');
        return res;
      }, [totalStats]);

      return (
        <div className="space-y-6">
          {/* Comparison Bar Selection Header */}
          <div className="p-5 bg-slate-900 border border-slate-800 rounded-xl space-y-4 shadow-sm">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">

                  <path d="M11.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122V6A2.5 2.5 0 0110 8.5H6a1 1 0 00-1 1v1.378a2.251 2.251 0 11-1.5 0V9.5A2.5 2.5 0 016 7h4a1 1 0 001-1v-.628A2.25 2.25 0 019.5 3.25zM4.25 12a.75.75 0 100 1.5.75.75 0 000-1.5z" />
                </svg>
                <h3 className="font-semibold text-sm text-white">Compare Feature Editions (GitHub Pull-Request Style)</h3>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-3">
              <div className="flex-1 min-w-[240px]">
                <label className="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">
                  Base Edition (A)
                </label>
                <select
                  value={idA}
                  onChange={e => setIdA(e.target.value)}
                  className="w-full px-3 py-2 text-xs bg-slate-950 border border-slate-800 rounded-lg text-white font-mono focus:outline-none focus:border-indigo-500"
                >
                  {books.map(b => (
                    <option key={b.id} value={b.id}>
                      {b.id} — {b.title} (v{b.version})
                    </option>
                  ))}
                </select>
              </div>

              <div className="pt-5 text-slate-500 font-mono text-sm hidden sm:block">&larr;</div>

              <div className="flex-1 min-w-[240px]">
                <label className="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">
                  Compare Edition (B)
                </label>
                <select
                  value={idB}
                  onChange={e => setIdB(e.target.value)}
                  className="w-full px-3 py-2 text-xs bg-slate-950 border border-slate-800 rounded-lg text-white font-mono focus:outline-none focus:border-indigo-500"
                >
                  {books.map(b => (
                    <option key={b.id} value={b.id}>
                      {b.id} — {b.title} (v{b.version})
                    </option>
                  ))}
                </select>
              </div>

              <div className="pt-5">
                <button
                  onClick={runDiff}
                  disabled={comparing}
                  className="px-5 py-2 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition-colors shadow-sm disabled:opacity-50 flex items-center gap-2"
                >
                  {comparing ? 'Computing Diff...' : 'Compare Changes'}
                </button>
              </div>
            </div>
          </div>

          {error && <div className="p-4 bg-red-950/60 border border-red-800 text-red-300 text-xs rounded-xl font-mono">{error}</div>}

          {diffData && (
            <div className="space-y-6 animate-fade-in">
              {/* GitHub PR Compare Header Bar */}
              <div className="bg-[#161b22] border border-[#30363d] rounded-xl p-4 flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <span className="px-2.5 py-1 text-xs font-mono font-bold rounded-md bg-[#21262d] text-[#c9d1d9] border border-[#30363d]">
                    base: <span className="text-indigo-400">{diffData.book_a.id} (v{diffData.book_a.version})</span>
                  </span>
                  <span className="text-slate-500">&larr;</span>
                  <span className="px-2.5 py-1 text-xs font-mono font-bold rounded-md bg-[#21262d] text-[#c9d1d9] border border-[#30363d]">
                    compare: <span className="text-indigo-400">{diffData.book_b.id} (v{diffData.book_b.version})</span>
                  </span>
                </div>

                {/* Diff Stats & View Mode Toggle */}
                <div className="flex items-center gap-4">
                  <div className="flex items-center gap-2 text-xs font-mono text-[#7d8590]">
                    <span>{diffData.steps_comparison?.length || 0} steps</span>
                    <span>•</span>
                    <span className="text-[#3fb950] font-semibold">+{totalStats.adds}</span>
                    <span className="text-[#f85149] font-semibold">-{totalStats.dels}</span>

                    {/* GitHub 5-square diff bar */}
                    <div className="flex items-center gap-0.5 ml-1">
                      {diffSquares.map((sq, i) => (
                        <div
                          key={i}
                          className={`w-2 h-2 rounded-[1px] ${
                            sq === 'green' ? 'bg-[#2ea043]' : sq === 'red' ? 'bg-[#f85149]' : 'bg-[#30363d]'
                          }`}
                        />
                      ))}
                    </div>
                  </div>

                  {/* Split / Unified Toggle */}
                  <div className="flex items-center bg-[#0d1117] p-0.5 rounded-lg border border-[#30363d]">
                    <button
                      onClick={() => setViewMode('split')}
                      className={`px-3 py-1 rounded text-xs font-semibold flex items-center gap-1.5 transition-all ${
                        viewMode === 'split' ? 'bg-[#21262d] text-white shadow-sm' : 'text-[#7d8590] hover:text-[#c9d1d9]'
                      }`}
                    >
                      <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 4v16m6-16v16M4 4h16v16H4V4z" />
                      </svg>
                      Split
                    </button>
                    <button
                      onClick={() => setViewMode('unified')}
                      className={`px-3 py-1 rounded text-xs font-semibold flex items-center gap-1.5 transition-all ${
                        viewMode === 'unified' ? 'bg-[#21262d] text-white shadow-sm' : 'text-[#7d8590] hover:text-[#c9d1d9]'
                      }`}
                    >
                      <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                      </svg>
                      Unified
                    </button>
                  </div>
                </div>
              </div>

              {/* Chapter Composition Delta Pills */}
              <div className="flex flex-wrap items-center gap-2">
                {diffData.added.length > 0 && (
                  <span className="px-2.5 py-1 rounded-md text-xs font-mono font-medium bg-[#2ea043]/15 text-[#3fb950] border border-[#2ea043]/30">
                    +{diffData.added.length} Chapters Added
                  </span>
                )}
                {diffData.removed.length > 0 && (
                  <span className="px-2.5 py-1 rounded-md text-xs font-mono font-medium bg-[#f85149]/15 text-[#f85149] border border-[#f85149]/30">
                    -{diffData.removed.length} Chapters Removed
                  </span>
                )}
                <span className="px-2.5 py-1 rounded-md text-xs font-mono font-medium bg-[#21262d] text-[#c9d1d9] border border-[#30363d]">
                  {diffData.kept.length} Chapters Kept Unchanged
                </span>
              </div>

              {/* Step-by-Step GitHub File Diff Boxes */}
              {diffData.steps_comparison && diffData.steps_comparison.length > 0 ? (
                <div className="space-y-6">
                  {diffData.steps_comparison.map(step => (
                    <div key={step.step_number} className="space-y-3">
                      {/* Step Header */}
                      <div className="flex items-center justify-between px-1">
                        <div className="flex items-center gap-2">
                          <span className="w-2 h-2 rounded-full bg-indigo-500"></span>
                          <h4 className="font-bold text-sm text-white font-mono">
                            STEP {step.step_number}:
                          </h4>
                          <span className="text-xs font-mono text-indigo-400">
                            {step.chapter_a.id} &rarr; {step.chapter_b.id}
                          </span>
                        </div>
                        {step.are_identical ? (
                          <span className="px-2 py-0.5 text-[10px] font-mono font-bold rounded bg-[#21262d] text-[#7d8590] border border-[#30363d]">
                            IDENTICAL
                          </span>
                        ) : (
                          <span className="px-2 py-0.5 text-[10px] font-mono font-bold rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">
                            MODIFIED
                          </span>
                        )}
                      </div>

                      {/* GitHub Diff Boxes for Prompt and Output */}
                      <GitHubDiffBox
                        title={`step-${step.step_number}/prompt.md`}
                        diffLines={step.prompt_diff}
                        viewMode={viewMode}
                        defaultOpen={!step.are_identical}
                      />
                      <GitHubDiffBox
                        title={`step-${step.step_number}/result.txt`}
                        diffLines={step.result_diff}
                        viewMode={viewMode}
                        defaultOpen={!step.are_identical}
                      />
                    </div>
                  ))}
                </div>
              ) : (
                <div className="p-8 text-center text-slate-500 bg-slate-900 border border-slate-800 rounded-xl">
                  No shared chapter steps to compare between these editions.
                </div>
              )}
            </div>
          )}
        </div>
      );
    }


    // --- View 6: Validation Telemetry ---
    function TelemetryView({ telemetry, chapters, onSelectChapter }) {
      const validatedChapters = chapters.filter(c => c.validation_status);
      const failedChapters = chapters.filter(c => c.validation_status === 'failed');

      return (
        <div className="space-y-6">
          <div className="p-6 bg-slate-900 border border-slate-800 rounded-xl space-y-4 shadow-sm">
            <h3 className="font-semibold text-sm text-white">Validation Gate Reliability Telemetry</h3>
            <p className="text-xs text-slate-400 max-w-2xl leading-relaxed">
              Every logged AI workflow output is tracked against automated validation gates (regex constraints, keyword verification, and JSON structural validation) to alert engineers of downstream prompt drift before deployment.
            </p>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
              <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl">
                <div className="text-xs text-slate-400 uppercase font-semibold">Total Gates Checked</div>
                <div className="text-2xl font-bold text-white mt-1">{telemetry.validatedCount}</div>
              </div>
              <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl">
                <div className="text-xs text-emerald-400 uppercase font-semibold">Passing Gates</div>
                <div className="text-2xl font-bold text-emerald-400 mt-1">{telemetry.passedCount}</div>
              </div>
              <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl">
                <div className="text-xs text-red-400 uppercase font-semibold">Failing Gates</div>
                <div className="text-2xl font-bold text-red-400 mt-1">{telemetry.failedCount}</div>
              </div>
            </div>
          </div>

          {failedChapters.length > 0 && (
            <div className="space-y-3">
              <h4 className="text-xs font-semibold tracking-wide uppercase text-red-400">
                Failed Validation Gates Breakdown
              </h4>
              <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-850 text-slate-400 uppercase font-semibold border-b border-slate-800 tracking-wider">
                    <tr>
                      <th className="py-3 px-4">Chapter ID</th>
                      <th className="py-3 px-4">Actor</th>
                      <th className="py-3 px-4">Timestamp</th>
                      <th className="py-3 px-4">Failure Reason</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800">
                    {failedChapters.map(ch => (
                      <tr
                        key={ch.id}
                        onClick={() => onSelectChapter(ch)}
                        className="hover:bg-slate-800/40 cursor-pointer transition-colors"
                      >
                        <td className="py-3 px-4 font-mono font-medium text-red-400">{ch.id}</td>
                        <td className="py-3 px-4 text-slate-300">{ch.actor}</td>
                        <td className="py-3 px-4 text-slate-400 font-mono">{new Date(ch.timestamp).toLocaleString()}</td>
                        <td className="py-3 px-4 text-red-300 font-medium">{ch.validation_message}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- Book Detail Drawer ---
    function BookDetailDrawer({ book, allChapters, apiUrl, onClose, onSelectChapter }) {
      const bookChapters = book.chapter_ids
        .map(cid => allChapters.find(c => c.id === cid))
        .filter(Boolean);

      return (
        <div className="fixed inset-0 z-50 flex justify-end bg-black/60 backdrop-blur-sm animate-fade-in">
          <div className="w-full max-w-xl bg-slate-900 border-l border-slate-800 h-full flex flex-col shadow-2xl p-6 overflow-y-auto">
            <div className="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
              <div>
                <span className="px-2 py-0.5 text-xs font-bold rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-mono">
                  v{book.version}
                </span>
                <h3 className="text-lg font-bold text-white mt-1">{book.title}</h3>
              </div>
              <button
                onClick={onClose}
                className="p-1 text-slate-400 hover:text-white rounded-md hover:bg-slate-800 transition-colors"
              >
                ✕
              </button>
            </div>

            <div className="space-y-4 text-xs font-mono text-slate-300">
              <div className="flex justify-between py-1.5 border-b border-slate-800">
                <span className="text-slate-500">Book ID:</span>
                <span className="font-semibold text-white">{book.id}</span>
              </div>
              <div className="flex justify-between py-1.5 border-b border-slate-800">
                <span className="text-slate-500">Feature:</span>
                <span>{book.feature}</span>
              </div>
              <div className="flex justify-between py-1.5 border-b border-slate-800">
                <span className="text-slate-500">Created:</span>
                <span>{new Date(book.created_at).toLocaleString()}</span>
              </div>
              {book.parent_book_id && (
                <div className="flex justify-between py-1.5 border-b border-slate-800">
                  <span className="text-slate-500">Parent Edition:</span>
                  <span className="text-indigo-400">{book.parent_book_id}</span>
                </div>
              )}
            </div>

            <div className="my-6">
              <h4 className="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">
                Bundled Chapters ({bookChapters.length})
              </h4>
              <div className="space-y-2">
                {bookChapters.map(ch => (
                  <div
                    key={ch.id}
                    onClick={() => onSelectChapter(ch)}
                    className="p-3 bg-slate-950 border border-slate-800 hover:border-indigo-500/40 rounded-lg cursor-pointer transition-colors"
                  >
                    <div className="flex items-center justify-between text-xs font-mono mb-1">
                      <span className="font-semibold text-indigo-400">{ch.id}</span>
                      <span className="text-slate-400">{ch.actor}</span>
                    </div>
                    <p className="text-xs text-slate-300 line-clamp-2">{ch.prompt}</p>
                  </div>
                ))}
              </div>
            </div>

            <div className="mt-auto pt-4 border-t border-slate-800 flex items-center gap-3">
              <a
                href={`${apiUrl}/export/book/${book.id}?format=markdown`}
                target="_blank"
                rel="noreferrer"
                className="flex-1 py-2 text-center text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition-colors"
              >
                Export Markdown
              </a>
              <a
                href={`${apiUrl}/export/book/${book.id}?format=json`}
                target="_blank"
                rel="noreferrer"
                className="flex-1 py-2 text-center text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition-colors"
              >
                Export JSON
              </a>
            </div>
          </div>
        </div>
      );
    }

    // --- Chapter Detail Drawer ---
    function ChapterDetailDrawer({ chapter, onClose }) {
      const copyToClipboard = text => {
        navigator.clipboard.writeText(text);
      };

      return (
        <div className="fixed inset-0 z-50 flex justify-end bg-black/60 backdrop-blur-sm animate-fade-in">
          <div className="w-full max-w-xl bg-slate-900 border-l border-slate-800 h-full flex flex-col shadow-2xl p-6 overflow-y-auto">
            <div className="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
              <div>
                <span className="font-mono text-xs text-indigo-400 font-bold">{chapter.id}</span>
                <h3 className="text-base font-bold text-white mt-0.5">Chapter Audit Record</h3>
              </div>
              <button
                onClick={onClose}
                className="p-1 text-slate-400 hover:text-white rounded-md hover:bg-slate-800 transition-colors"
              >
                ✕
              </button>
            </div>

            <div className="space-y-3 text-xs font-mono text-slate-300 mb-6">
              <div className="flex justify-between py-1.5 border-b border-slate-800">
                <span className="text-slate-500">Actor:</span>
                <span className="font-semibold text-white">{chapter.actor}</span>
              </div>
              <div className="flex justify-between py-1.5 border-b border-slate-800">
                <span className="text-slate-500">Source:</span>
                <span>{chapter.source}</span>
              </div>
              <div className="flex justify-between py-1.5 border-b border-slate-800">
                <span className="text-slate-500">Timestamp:</span>
                <span>{new Date(chapter.timestamp).toLocaleString()}</span>
              </div>
              {chapter.model && (
                <div className="flex justify-between py-1.5 border-b border-slate-800">
                  <span className="text-slate-500">Model:</span>
                  <span className="text-indigo-400">{chapter.model}</span>
                </div>
              )}
              {chapter.temperature !== null && (
                <div className="flex justify-between py-1.5 border-b border-slate-800">
                  <span className="text-slate-500">Temperature:</span>
                  <span>{chapter.temperature}</span>
                </div>
              )}
              {chapter.seed !== null && (
                <div className="flex justify-between py-1.5 border-b border-slate-800">
                  <span className="text-slate-500">Random Seed:</span>
                  <span>{chapter.seed}</span>
                </div>
              )}
              {chapter.validation_status && (
                <div className="flex justify-between py-1.5 border-b border-slate-800 items-center">
                  <span className="text-slate-500">Validation Gate:</span>
                  <span
                    className={`font-bold px-2 py-0.5 rounded text-[11px] ${
                      chapter.validation_status === 'passed'
                        ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'
                        : 'bg-red-500/10 text-red-400 border border-red-500/20'
                    }`}
                  >
                    {chapter.validation_status.toUpperCase()} ({chapter.validation_message})
                  </span>
                </div>
              )}
            </div>

            {/* Prompt Block */}
            <div className="space-y-2 mb-6">
              <div className="flex items-center justify-between">
                <h4 className="text-xs font-semibold uppercase tracking-wider text-slate-400">Prompt</h4>
                <button
                  onClick={() => copyToClipboard(chapter.prompt)}
                  className="text-[11px] text-indigo-400 hover:text-indigo-300 transition-colors"
                >
                  Copy Prompt
                </button>
              </div>
              <div className="p-3 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono text-slate-200 whitespace-pre-wrap leading-relaxed max-h-48 overflow-y-auto">
                {chapter.prompt}
              </div>
            </div>

            {/* Result Block */}
            <div className="space-y-2">
              <div className="flex items-center justify-between">
                <h4 className="text-xs font-semibold uppercase tracking-wider text-slate-400">Output Result</h4>
                <button
                  onClick={() => copyToClipboard(chapter.result)}
                  className="text-[11px] text-indigo-400 hover:text-indigo-300 transition-colors"
                >
                  Copy Result
                </button>
              </div>
              <div className="p-3 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono text-slate-200 whitespace-pre-wrap leading-relaxed max-h-64 overflow-y-auto">
                {chapter.result}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- Settings Modal ---
    function SettingsModal({ currentUrl, currentKey, onSave, onClose }) {
      const [url, setUrl] = useState(currentUrl);
      const [key, setKey] = useState(currentKey);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
          <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4">
            <h3 className="text-base font-bold text-white">API Connection Settings</h3>
            <p className="text-xs text-slate-400">
              Configure the target AI Audit Shelf backend URL and optional authentication headers.
            </p>

            <div className="space-y-3 text-xs">
              <div>
                <label className="block text-slate-400 font-semibold mb-1">API Base URL</label>
                <input
                  type="text"
                  value={url}
                  onChange={e => setUrl(e.target.value)}
                  placeholder="http://127.0.0.1:8000"
                  className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-white font-mono focus:outline-none focus:border-indigo-500"
                />
              </div>
              <div>
                <label className="block text-slate-400 font-semibold mb-1">API Key (X-API-Key)</label>
                <input
                  type="password"
                  value={key}
                  onChange={e => setKey(e.target.value)}
                  placeholder="Optional write API key"
                  className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-white font-mono focus:outline-none focus:border-indigo-500"
                />
              </div>
            </div>

            <div className="flex justify-end gap-3 pt-3 border-t border-slate-800">
              <button
                onClick={onClose}
                className="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-white rounded-lg transition-colors"
              >
                Cancel
              </button>
              <button
                onClick={() => onSave(url.replace(/\/+$/, ''), key)}
                className="px-4 py-2 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition-colors shadow-sm"
              >
                Save Settings
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
